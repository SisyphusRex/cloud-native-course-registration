<svg xmlns="http://www.w3.org/2000/svg" width="930" height="710" viewBox="0 0 930 710" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="930" height="710" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#222">Course Registration API: Architecture</text>

  <!-- Client -->
  <rect x="30" y="250" width="150" height="140" rx="10" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
  <text x="105" y="305" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Client</text>
  <text x="105" y="330" font-size="13" fill="#444" text-anchor="middle">Browser · curl ·</text>
  <text x="105" y="348" font-size="13" fill="#444" text-anchor="middle">test script</text>

  <!-- Google Cloud Platform -->
  <rect x="270" y="70" width="630" height="580" rx="12" fill="#eef4fd" stroke="#4a7fd6" stroke-width="2"/>
  <text x="290" y="98" font-size="17" font-weight="bold" fill="#2a5db0">Google Cloud Platform</text>

  <!-- Cloud Run service -->
  <rect x="300" y="115" width="575" height="415" rx="10" fill="#ffffff" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="320" y="141" font-size="15" font-weight="bold" fill="#222">Cloud Run service: registration-api (https://….run.app)</text>
  <text x="320" y="160" font-size="12" fill="#555">Serverless · scales from 0 to N instances with traffic</text>

  <!-- Additional instances (stacked) -->
  <text x="860" y="160" font-size="12" fill="#555" text-anchor="end">Instances 2…N, added under load</text>
  <rect x="370" y="168" width="475" height="300" rx="10" fill="#f1f8f4" stroke="#8fbfa6" stroke-width="1.2"/>
  <rect x="355" y="179" width="475" height="300" rx="10" fill="#eaf5ef" stroke="#7fb397" stroke-width="1.2"/>

  <!-- Instance 1: Docker container -->
  <rect x="340" y="190" width="475" height="300" rx="10" fill="#e3f2ea" stroke="#3d8f66" stroke-width="2"/>
  <text x="360" y="215" font-size="15" font-weight="bold" fill="#1f5c40">Docker container (instance 1)</text>
  <text x="795" y="215" font-size="12" fill="#3d6b55" text-anchor="end">image: python:3.12-slim</text>

  <!-- gunicorn -->
  <rect x="360" y="228" width="435" height="42" rx="6" fill="#ffffff" stroke="#3d8f66" stroke-width="1.2"/>
  <text x="377" y="254" font-size="13" fill="#222"><tspan font-weight="bold">gunicorn</tspan>  ·  binds 0.0.0.0:$PORT  ·  1 worker, 8 threads</text>

  <!-- Flask REST API -->
  <rect x="360" y="280" width="435" height="120" rx="6" fill="#ffffff" stroke="#3d8f66" stroke-width="1.2"/>
  <text x="377" y="304" font-size="14" font-weight="bold" fill="#222">Flask REST API (registration_api)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#333">
    <text x="377" y="332">GET    /</text>
    <text x="377" y="354">GET    /courses</text>
    <text x="377" y="376">POST   /register</text>
    <text x="582" y="332">GET    /courses/&lt;id&gt;</text>
    <text x="582" y="354">PUT    /courses/&lt;id&gt;</text>
    <text x="582" y="376">DELETE /courses/&lt;id&gt;</text>
  </g>

  <!-- In-memory state -->
  <rect x="360" y="410" width="435" height="62" rx="6" fill="#fff6e5" stroke="#d9912b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="377" y="434" font-size="13" fill="#222"><tspan font-weight="bold">In-memory state:</tspan> course catalog, registrations</text>
  <text x="377" y="456" font-size="12" fill="#8a5a12">Per instance · not shared · lost on restart</text>

  <!-- Request path: client <-> container -->
  <line x1="180" y1="305" x2="338" y2="305" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="338" y1="335" x2="182" y2="335" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="187" y="296" font-size="11" fill="#333">HTTPS request</text>
  <text x="187" y="353" font-size="11" fill="#333">JSON response</text>

  <!-- Deployment path -->
  <rect x="30" y="560" width="150" height="72" rx="10" fill="#f2f2f2" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="105" y="585" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Developer</text>
  <text x="105" y="604" font-size="12" fill="#555" text-anchor="middle">docker build</text>
  <text x="105" y="621" font-size="12" fill="#555" text-anchor="middle">gcloud run deploy</text>

  <rect x="340" y="565" width="270" height="62" rx="8" fill="#ffffff" stroke="#4a7fd6" stroke-width="1.2"/>
  <text x="475" y="590" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Artifact Registry</text>
  <text x="475" y="610" font-size="12" fill="#444" text-anchor="middle">container image: registration-api</text>

  <line x1="180" y1="596" x2="338" y2="596" stroke="#777" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-muted)"/>
  <text x="187" y="587" font-size="11" fill="#555">push, deploy</text>
  <line x1="475" y1="563" x2="475" y2="493" stroke="#777" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-muted)"/>
  <text x="485" y="548" font-size="11" fill="#555">pull image on instance start</text>

  <!-- Legend -->
  <line x1="40" y1="682" x2="80" y2="682" stroke="#333" stroke-width="2"/>
  <text x="88" y="686" font-size="12" fill="#333">Request path</text>
  <line x1="190" y1="682" x2="230" y2="682" stroke="#777" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="238" y="686" font-size="12" fill="#333">Deployment path</text>
  <rect x="360" y="674" width="30" height="16" rx="3" fill="#fff6e5" stroke="#d9912b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="398" y="686" font-size="12" fill="#333">State held only in memory (see Part D)</text>
</svg>
