<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1000" viewBox="0 0 1040 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="1040" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="42" font-size="22" font-weight="bold" fill="#222">Course Registration API: Deploy Pipeline</text>

  <!-- Lanes -->
  <rect x="20" y="70" width="200" height="910" rx="12" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
  <text x="120" y="98" font-size="17" font-weight="bold" fill="#333" text-anchor="middle">Developer</text>

  <rect x="240" y="70" width="360" height="910" rx="12" fill="#f6f2fb" stroke="#8a63c4" stroke-width="2"/>
  <text x="260" y="98" font-size="17" font-weight="bold" fill="#5b3a91">GitHub</text>

  <rect x="620" y="70" width="400" height="910" rx="12" fill="#eef4fd" stroke="#4a7fd6" stroke-width="2"/>
  <text x="640" y="98" font-size="17" font-weight="bold" fill="#2a5db0">Google Cloud Platform (cs6030-registration)</text>

  <!-- 1. Push -->
  <rect x="35" y="120" width="170" height="80" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <text x="120" y="148" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">1. git push origin main</text>
  <text x="120" y="168" font-size="12" fill="#444" text-anchor="middle">fast-forward from</text>
  <text x="120" y="185" font-size="12" fill="#444" text-anchor="middle">development</text>

  <line x1="205" y1="160" x2="258" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Ruleset -->
  <rect x="260" y="120" width="320" height="80" rx="8" fill="#ffffff" stroke="#8a63c4" stroke-width="1.5"/>
  <text x="280" y="146" font-size="14" font-weight="bold" fill="#222">2. Ruleset: protect-main</text>
  <text x="280" y="166" font-size="12" fill="#444">Push accepted only if the commit already</text>
  <text x="280" y="183" font-size="12" fill="#444">has a passing test check from development</text>

  <line x1="420" y1="200" x2="420" y2="228" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Workflow triggered -->
  <rect x="260" y="230" width="320" height="70" rx="8" fill="#ffffff" stroke="#8a63c4" stroke-width="1.5"/>
  <text x="280" y="256" font-size="14" font-weight="bold" fill="#222">3. Workflow: Deploy to Cloud Run</text>
  <text x="280" y="277" font-size="12" fill="#444">deploy.yml · on: push to main</text>

  <line x1="420" y1="300" x2="420" y2="328" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Test job -->
  <rect x="260" y="330" width="320" height="80" rx="8" fill="#e3f2ea" stroke="#3d8f66" stroke-width="1.5"/>
  <text x="280" y="356" font-size="14" font-weight="bold" fill="#1f5c40">4. Job: test (test.yml)</text>
  <text x="280" y="376" font-size="12" fill="#3d6b55">uv sync --frozen → uv run pytest</text>
  <text x="280" y="394" font-size="12" fill="#3d6b55">If tests fail, the run stops here</text>

  <line x1="420" y1="410" x2="420" y2="438" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="429" font-size="11" fill="#555">needs: test</text>

  <!-- 5. Deploy job -->
  <rect x="260" y="440" width="320" height="520" rx="10" fill="#ffffff" stroke="#8a63c4" stroke-width="1.5"/>
  <text x="280" y="466" font-size="14" font-weight="bold" fill="#222">5. Job: deploy</text>
  <text x="280" y="485" font-size="12" fill="#444">environment: production (main only;</text>
  <text x="280" y="501" font-size="12" fill="#444">unlocks the two GCP_* secrets)</text>

  <rect x="280" y="515" width="280" height="55" rx="6" fill="#f6f2fb" stroke="#8a63c4" stroke-width="1"/>
  <text x="295" y="538" font-size="13" font-weight="bold" fill="#222">a. google-github-actions/auth</text>
  <text x="295" y="557" font-size="12" fill="#444">Sends GitHub's OIDC token to GCP</text>

  <rect x="280" y="600" width="280" height="55" rx="6" fill="#f6f2fb" stroke="#8a63c4" stroke-width="1"/>
  <text x="295" y="623" font-size="13" font-weight="bold" fill="#222">b. gcloud run deploy registration-api</text>
  <text x="295" y="642" font-size="12" fill="#444">--source . --region us-central1</text>

  <line x1="420" y1="655" x2="420" y2="878" stroke="#777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>
  <text x="430" y="770" font-size="11" fill="#555">waits for build</text>
  <text x="430" y="785" font-size="11" fill="#555">and rollout</text>

  <rect x="280" y="880" width="280" height="55" rx="6" fill="#f6f2fb" stroke="#8a63c4" stroke-width="1"/>
  <text x="295" y="903" font-size="13" font-weight="bold" fill="#222">c. Record the service URL</text>
  <text x="295" y="922" font-size="12" fill="#444">Shown on the production deployment</text>

  <!-- 6. Workload Identity Federation -->
  <rect x="640" y="505" width="360" height="75" rx="8" fill="#ffffff" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="660" y="529" font-size="14" font-weight="bold" fill="#222">6. Workload Identity Federation</text>
  <text x="660" y="548" font-size="12" fill="#444">Subject must match …:environment:production</text>
  <text x="660" y="565" font-size="12" fill="#444">→ short-lived token as github-deployer</text>

  <line x1="560" y1="533" x2="638" y2="533" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="555" x2="562" y2="555" stroke="#777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>

  <!-- 7. Cloud Storage -->
  <rect x="640" y="600" width="360" height="60" rx="8" fill="#ffffff" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="660" y="624" font-size="14" font-weight="bold" fill="#222">7. Cloud Storage</text>
  <text x="660" y="644" font-size="12" fill="#444">Source code uploaded as an archive</text>

  <line x1="560" y1="628" x2="638" y2="628" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="820" y1="660" x2="820" y2="688" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. Cloud Build -->
  <rect x="640" y="690" width="360" height="60" rx="8" fill="#ffffff" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="660" y="714" font-size="14" font-weight="bold" fill="#222">8. Cloud Build</text>
  <text x="660" y="734" font-size="12" fill="#444">Builds the container image from the Dockerfile</text>

  <line x1="820" y1="750" x2="820" y2="778" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. Artifact Registry -->
  <rect x="640" y="780" width="360" height="60" rx="8" fill="#ffffff" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="660" y="804" font-size="14" font-weight="bold" fill="#222">9. Artifact Registry</text>
  <text x="660" y="824" font-size="12" fill="#444">Image stored in cloud-run-source-deploy</text>

  <line x1="820" y1="840" x2="820" y2="868" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 10. Cloud Run -->
  <rect x="640" y="870" width="360" height="90" rx="8" fill="#e3f2ea" stroke="#3d8f66" stroke-width="2"/>
  <text x="660" y="894" font-size="14" font-weight="bold" fill="#1f5c40">10. Cloud Run: registration-api</text>
  <text x="660" y="914" font-size="12" fill="#3d6b55">New revision registration-api-0000N</text>
  <text x="660" y="931" font-size="12" fill="#3d6b55">gets 100% of traffic</text>
  <text x="660" y="948" font-size="12" fill="#3d6b55">Containers run gunicorn on $PORT</text>

  <line x1="640" y1="907" x2="562" y2="907" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/></svg>
