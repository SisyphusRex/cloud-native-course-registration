name: Test

on:
  # Running on development pushes puts a passing check on the commit before
  # it is fast-forwarded onto main, which the main ruleset requires.
  push:
    branches: [development]
  pull_request:
    branches: [main]
  # Lets deploy.yml run the same tests before deploying.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest
